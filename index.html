<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nathaniel Budz</title>
<meta name="description" content="NathanielBudz.com is coming soon.">
<meta name="theme-color" content="#f3f3f0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f3f3f0;--ink:#12161d;--dim:#4a5260}
html,body{height:100%;background:var(--bg);color:var(--ink)}
body{font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
#jets{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none}
main{position:relative;height:100%;display:flex;align-items:center;justify-content:center;padding:0 16px;text-align:center}
.mark{position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center;gap:16px}
.mark::before{content:"";position:absolute;inset:-14px -22px;z-index:-1;pointer-events:none;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);background:radial-gradient(closest-side,rgba(243,243,240,.72),rgba(243,243,240,0));-webkit-mask-image:radial-gradient(closest-side,#000 55%,transparent);mask-image:radial-gradient(closest-side,#000 55%,transparent)}
h1{font-family:'Archivo',system-ui,sans-serif;font-weight:800;font-stretch:118%;font-size:min(33px,7.2vw);line-height:1;letter-spacing:-.025em}
.soon{font-size:13px;font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:var(--dim);padding-left:.32em}
.credit{position:fixed;left:16px;bottom:12px;font-size:11px;color:var(--dim)}
.credit a{color:inherit}
</style>
</head>
<body>
<canvas id="jets" aria-hidden="true"></canvas>
<main>
  <div class="mark">
    <h1>NathanielBudz.com</h1>
    <p class="soon">Coming soon</p>
  </div>
</main>
<p class="credit"><a href="https://sketchfab.com/3d-models/lockheed-martin-f-35b-lightning-ii-5d54a6af45974ad386ae74d42b33374a">F-35B</a> by AF267, <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a></p>
<script src="assets/js/jet-ascii.js"></script>
<script>
JetAscii.start(document.getElementById('jets'), {
  base: 'assets/jets/',
  jets: ['yf23', 'f35'],
  theme: 'light',
  color: false,
  count: 3,
  size: [0.08, 0.145],
  speed: 1,
  turnRate: 0.42,
  bank: 1,
  formation: 0.3,
  pattern: 'lanes',
  breaks: true,
  breakEvery: 30,
  tilt: 0.3,
  avoid: true,
  cellW: 5.5,
  cellH: 7.5,
  glyph: 0.78,
  weight: 500,
  ramp: ' .:-=+*#%@',
  gain: 1.5,
  gamma: 0.78,
  edges: 1.35,
  jitter: 0.14,
  dots: 0.14,
  contrails: false,
  afterburner: false,
  nav: false,
});
</script>
</body>
</html>
